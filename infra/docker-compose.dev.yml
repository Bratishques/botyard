# Окружение для разработки api. Порты сдвинуты, чтобы не мешать другим локальным Postgres и Redis.
name: botyard-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: botyard
      POSTGRES_PASSWORD: botyard
      POSTGRES_DB: botyard
    ports:
      - "55432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botyard"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: botyard
      RABBITMQ_DEFAULT_PASS: botyard
    # vhost botyard_test — для интеграционных тестов, как база botyard_test: запущенный dev-воркер на vhost `/`
    # не заберёт сообщения тестов. Создаётся после старта брокера, повторный старт ничего не ломает.
    # Ждём cookie брокера: rabbitmqctl от root раньше него создал бы свой, и брокер его не прочитал бы
    entrypoint:
      - sh
      - -c
      - >-
        (until [ -f /var/lib/rabbitmq/.erlang.cookie ]; do sleep 1; done;
        rabbitmqctl await_startup && rabbitmqctl add_vhost botyard_test;
        rabbitmqctl set_permissions -p botyard_test botyard '.*' '.*' '.*') >/dev/null 2>&1 &
        exec docker-entrypoint.sh rabbitmq-server
    ports:
      - "55672:5672"    # AMQP
      - "55673:15672"   # UI: http://localhost:55673
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmqctl list_vhosts --quiet | grep -qx botyard_test"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pg-data:
  rabbit-data:
