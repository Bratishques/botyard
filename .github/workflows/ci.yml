name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Монорепо на Turborepo: зависимости ставятся один раз в корне, задачи идут по графу пакетов (turbo.json)
  api:
    runs-on: ubuntu-latest
    services:
      # Порт и учётные данные совпадают с infra/docker-compose.dev.yml и api/.env.test
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: botyard
          POSTGRES_PASSWORD: botyard
          POSTGRES_DB: botyard_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U botyard"
          --health-interval 5s
          --health-retries 10
      # Как в infra/docker-compose.dev.yml и api/.env.test
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: botyard
          RABBITMQ_DEFAULT_PASS: botyard
          # Тесты ходят в свой vhost, как в свою базу (api/.env.test)
          RABBITMQ_DEFAULT_VHOST: botyard_test
        ports:
          - 55672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # lint, typecheck и unit-тесты всех пакетов (api, packages/contract)
      - run: bun run check
      # Интеграционные — без кеша: зависят от живых Postgres и RabbitMQ
      - run: bun run test:int

  bots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bot manifests are JSON
        run: for f in bots/templates/*/template.json bots/schema/template.schema.json; do python3 -m json.tool "$f" > /dev/null; done
